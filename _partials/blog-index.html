<!DOCTYPE html>
<html lang="en-US" prefix="og: https://ogp.me/ns#">
<head>
{{page_meta}}
{{base_head}}
<style>
/* === Blog Index Card Layout === */
.kg-blog-list { display: flex; flex-direction: column; gap: 0; }
.kg-blog-card { display: flex; gap: 24px; padding: 28px 0; border-bottom: 1px solid #E4DACC; align-items: flex-start; }
.kg-blog-card:first-child { padding-top: 0; }
.kg-blog-card > a:first-child { flex: 0 0 220px; width: 220px; display: block; }
.kg-blog-card-img { width: 100%; height: 150px; object-fit: cover; border-radius: 6px; display: block; }
.kg-blog-card-no-img { width: 100%; height: 150px; background: #F4EDE4; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.kg-blog-card-no-img svg { width: 40px; height: 40px; opacity: 0.4; }
.kg-blog-card-body { flex: 1; min-width: 0; }
.kg-blog-card-date { font-size: 0.82rem; color: #999; margin-bottom: 6px; }
.kg-blog-card-title { font-size: 1.1rem; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
.kg-blog-card-title a { color: #201B10; text-decoration: none; }
.kg-blog-card-title a:hover { color: #AE360E; }
.kg-blog-card-excerpt { font-size: 0.9rem; color: #666; line-height: 1.6; margin-bottom: 12px; }
.kg-blog-card-link { font-size: 0.88rem; font-weight: 600; color: #AE360E; text-decoration: none; }
.kg-blog-card-link:hover { text-decoration: underline; }
.kg-pagination { margin-top: 32px; display: flex; gap: 8px; flex-wrap: wrap; }
.kg-pagination a { color: #AE360E !important; font-weight: 600; padding: 6px 12px; border: 1px solid #E4DACC; border-radius: 4px; text-decoration: none; }
.kg-pagination a:hover { background: #AE360E; color: #fff !important; border-color: #AE360E; }
.kg-pagination .kg-pagination-current { padding: 6px 12px; border: 1px solid #AE360E; border-radius: 4px; background: #AE360E; color: #fff; font-weight: 600; }
@media (max-width: 600px) {
  .kg-blog-card { flex-direction: column; gap: 14px; }
  .kg-blog-card > a:first-child { width: 100%; flex: none; }
  .kg-blog-card-img, .kg-blog-card-no-img { height: 200px; }
}
</style>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K8ZXCK8V" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="preloader"><div class="preloader__image" style="background-image:url(/assets/images/keystone-logo-white.png);"></div></div>
<div class="page-wrapper">
{{header}}
<section class="page-header">
  <div class="page-header__bg" style="background-image:url(/assets/images/backgrounds/page-header-bg-1-1.jpg);"></div>
  <div class="container">
    <h2 class="page-header__title">{{page_title}}</h2>
    <div class="wallox-breadcrumb">
      <ul class="wallox-breadcrumb__list list-unstyled">
        <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><span>Blog</span></li>
      </ul>
    </div>
  </div>
</section>
<section style="padding:60px 0 80px;">
  <div class="container">
    <div style="max-width:860px;margin:0 auto;padding:0 20px;">
      {{posts_html}}
      {{pagination_html}}
    </div>
  </div>
</section>
{{footer}}
</div>
<div class="mobile-nav__wrapper">
  <div class="mobile-nav__overlay mobile-nav__toggler"></div>
  <div class="mobile-nav__content">
    <span class="mobile-nav__close mobile-nav__toggler"><i class="fa-solid fa-xmark"></i></span>
    <div class="logo-box"><a href="/"><img src="/assets/images/keystone-logo-white.png" width="140" alt="Keystone Painting" style="display:block;margin:0 auto;" loading="lazy"></a></div>
    <div class="mobile-nav__container"></div>
    <ul class="mobile-nav__contact list-unstyled">
      <li><i class="fa-solid fa-envelope"></i><a href="mailto:josh@paintkeystone.com">josh@paintkeystone.com</a></li>
      <li><i class="fa-solid fa-phone"></i><a href="tel:9706703965">(970) 670-3965</a></li>
    </ul>
  </div>
</div>
<a href="#" data-target="html" class="scroll-to-target scroll-to-top">
  <span class="scroll-to-top__text">back top</span>
  <span class="scroll-to-top__wrapper"><span class="scroll-to-top__inner"></span></span>
</a>
<script src="/assets/vendors/jquery/jquery-3.7.0.min.js"></script>
<script src="/assets/vendors/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/vendors/jquery-appear/jquery.appear.min.js"></script>
<script src="/assets/vendors/wow/wow.js"></script>
<script src="/assets/js/wallox.js"></script>
<script>
function setActiveNav() {
  var path = window.location.pathname.replace(/\/index\.html$/, '/').replace(/\.html$/, '/').replace(/\/?$/, '/');
  var items = document.querySelectorAll('.main-menu__list > li');
  items.forEach(function(li){ li.classList.remove('current'); });
  items.forEach(function(li){
    var a = li.querySelector('a');
    if (!a) return;
    var href = (a.getAttribute('href') || '').replace(/\/index\.html$/, '/').replace(/\.html$/, '/').replace(/\/?$/, '/');
    if (!href || href === '#/' || href === '#') return;
    if (path === href || (href.length > 1 && path.startsWith(href))) li.classList.add('current');
  });
}
setActiveNav();
setTimeout(setActiveNav, 200);
</script>
</body>
</html>
