<section class="reviews-section" style="padding:80px 0;background:#f9f5f1;">
  <div class="container">
    <div class="sec-title text-center" style="margin-bottom:48px;">
      <div class="d-flex align-items-center justify-content-center">
        <h6 class="sec-title__tagline">what our clients say</h6>
      </div>
      <h3 class="sec-title__title">A Painter Near You with 5-Star Reviews</h3>
      <div style="display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:15px;color:#5a5650;font-weight:500;">
        Current
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22" style="display:inline-block;vertical-align:middle;">
          <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
          <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
          <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
          <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
        </svg>
        Rating: <strong style="color:#201B10;"><!-- RATING_VALUE --></strong>
      </div>
    </div>

    <!-- Carousel wrapper -->
    <div class="ks-reviews-carousel" style="position:relative;">

      <!-- Prev arrow -->
      <button class="ks-reviews-arrow ks-reviews-prev" aria-label="Previous reviews"
        style="position:absolute;left:-20px;top:50%;transform:translateY(-50%);z-index:10;background:#fff;border:2px solid #e8e0d8;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.10);transition:background 0.2s;">
        <i class="fa-solid fa-chevron-left" style="color:#AE360E;font-size:16px;"></i>
      </button>

      <!-- Viewport -->
      <div class="ks-reviews-viewport" style="overflow:hidden;">
        <div class="ks-reviews-track" style="display:flex;gap:24px;transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);">
          <!-- REVIEW_CARDS -->
        </div>
      </div>

      <!-- Next arrow -->
      <button class="ks-reviews-arrow ks-reviews-next" aria-label="Next reviews"
        style="position:absolute;right:-20px;top:50%;transform:translateY(-50%);z-index:10;background:#fff;border:2px solid #e8e0d8;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.10);transition:background 0.2s;">
        <i class="fa-solid fa-chevron-right" style="color:#AE360E;font-size:16px;"></i>
      </button>
    </div>

    <div class="text-center" style="margin-top:40px;">
      <a href="https://maps.app.goo.gl/ZmPa6ZybegVChtbc9" target="_blank" rel="noopener noreferrer"
         class="wallox-btn wallox-btn--border">See All Google Reviews <i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </div>
</section>

<style>
.ks-reviews-track > * {
  flex: 0 0 calc((100% - 48px) / 3);
  min-width: calc((100% - 48px) / 3);
}
@media (max-width: 991px) {
  .ks-reviews-track > * {
    flex: 0 0 calc((100% - 24px) / 2);
    min-width: calc((100% - 24px) / 2);
  }
}
@media (max-width: 575px) {
  .ks-reviews-track > * { flex: 0 0 100%; min-width: 100%; }
  .ks-reviews-prev { left: -10px; }
  .ks-reviews-next { right: -10px; }
}
.ks-reviews-arrow:hover { background: #AE360E !important; }
.ks-reviews-arrow:hover i { color: #fff !important; }
</style>

<script>
(function() {
  var track = document.querySelector('.ks-reviews-track');
  var viewport = document.querySelector('.ks-reviews-viewport');
  if (!track || !viewport) return;

  var cards = track.children;
  var total = cards.length;
  var current = 0;

  function getVisible() {
    var w = viewport.offsetWidth;
    if (w < 576) return 1;
    if (w < 992) return 2;
    return 3;
  }

  function getCardWidth() {
    var vis = getVisible();
    var gap = 24;
    return (viewport.offsetWidth - gap * (vis - 1)) / vis;
  }

  function slideTo(idx) {
    var vis = getVisible();
    var max = Math.max(0, total - vis);
    current = Math.max(0, Math.min(idx, max));
    var offset = current * (getCardWidth() + 24);
    track.style.transform = 'translateX(-' + offset + 'px)';
  }

  document.querySelector('.ks-reviews-prev').addEventListener('click', function() { slideTo(current - 1); });
  document.querySelector('.ks-reviews-next').addEventListener('click', function() { slideTo(current + 1); });

  window.addEventListener('resize', function() { slideTo(current); });
})();
</script>
